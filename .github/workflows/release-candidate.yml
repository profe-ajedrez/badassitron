name: M7-H imported-backend release-candidate checks

on:
  workflow_dispatch:
  push:
    branches: ['migration/**']
  pull_request:

jobs:
  technical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify technical release invariants, race and frozen oracles
        run: bash tools/release/verify.sh
      - name: Upload official module audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7h-official-module-audit
          path: reports/migration/m7h-official-module-audit.md
          if-no-files-found: warn

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Compare facade with direct Jokruger
        run: BENCHTIME=250ms COUNT=7 bash tools/release/bench-backend.sh reports/migration/m7h-ci-backend
      - name: Upload same-build performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7h-same-build-benchmarks
          path: reports/migration/m7h-ci-backend/
          if-no-files-found: warn
